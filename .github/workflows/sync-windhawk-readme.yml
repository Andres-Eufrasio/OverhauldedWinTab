name: Sync Windhawk README

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "OverhauldedWinTab.wh.cpp"
      - ".github/workflows/sync-windhawk-readme.yml"

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync README.md into Windhawk mod
        shell: python
        run: |
          from pathlib import Path
          import re

          readme_path = Path("README.md")
          mod_path = Path("OverhauldedWinTab.wh.cpp")

          if not readme_path.exists():
              raise SystemExit("ERROR: README.md not found.")

          if not mod_path.exists():
              raise SystemExit("ERROR: OverhauldedWinTab.wh.cpp not found.")

          readme = readme_path.read_text(encoding="utf-8")
          mod = mod_path.read_text(encoding="utf-8")

          start_marker = "// ==WindhawkModReadme=="
          end_marker = "// ==/WindhawkModReadme=="

          if start_marker not in mod:
              raise SystemExit("ERROR: // ==WindhawkModReadme== not found.")

          if end_marker not in mod:
              raise SystemExit("ERROR: // ==/WindhawkModReadme== not found.")

          # Normalize Markdown bullet lists that use "*" to "-".
          # Bold text ("**...**") is not affected.
          readme = re.sub(r"(?m)^(\s*)\*\s+", r"\1- ", readme)

          windhawk_readme = readme.rstrip()

          start = mod.index(start_marker)
          end = mod.index(end_marker, start)

          replacement = (
              start_marker
              + "\n"
              + "/*\n"
              + windhawk_readme
              + "\n"
              + "*/\n"
              + end_marker
          )

          new_mod = mod[:start] + replacement + mod[end + len(end_marker):]

          if new_mod == mod:
              print("README already in sync.")
          else:
              mod_path.write_text(new_mod, encoding="utf-8")
              print("README synced into the mod.")

      - name: Commit synchronized README
        shell: bash
        run: |
          if git diff --quiet -- OverhauldedWinTab.wh.cpp; then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add OverhauldedWinTab.wh.cpp
          git commit -m "docs: sync Windhawk README"
          git push
